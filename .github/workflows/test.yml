name: Tests

# Runs on every push and pull request. It never deploys anything.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  panel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: panel } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm, cache-dependency-path: panel/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
