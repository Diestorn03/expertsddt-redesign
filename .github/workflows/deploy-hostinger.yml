name: Deploy to Hostinger

# Manual on purpose: nothing reaches expertsddt.com without someone pressing the button.
# Production runs wait for approval (GitHub Environment "production" with required reviewers).
# Rollback = run this workflow again with an older tag/commit in "ref".
on:
  push:
    branches: [main]   # every push to main updates staging (production is manual and needs approval)
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Branch, tag or commit to deploy (use an older tag to roll back)
        default: main
      dry_run:
        description: List what would be uploaded without changing the server
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hostinger-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

env:
  # Pinned to commit SHAs (supply-chain safety): checkout v4, setup-node v4, upload/download-artifact v4, FTP-Deploy-Action v4.3.5
  SITE_URL: ${{ (inputs.target || 'staging') == 'production' && 'https://expertsddt.com' || vars.STAGING_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.5.2 # the lockfiles are written by npm 11; Node 22's bundled npm 10 rejects them in npm ci
      - run: npm ci
      - name: English and Spanish dictionaries have the same keys
        run: npm run test:i18n
      - name: Redirect rules still send old WordPress URLs to the right place
        run: npm run test:redirects
      - name: Build
        run: npm run build
        env:
          # Public settings, set under Settings > Secrets and variables > Actions > Variables
          PUBLIC_SHOP_URL: ${{ vars.PUBLIC_SHOP_URL }}
          PUBLIC_N8N_FORM_WEBHOOK: ${{ vars.PUBLIC_N8N_FORM_WEBHOOK }}
          PUBLIC_GCAL_EMBED: ${{ vars.PUBLIC_GCAL_EMBED }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_SHOW_REVIEWS: ${{ vars.PUBLIC_SHOW_REVIEWS }}
          PUBLIC_WHATSAPP: ${{ vars.PUBLIC_WHATSAPP || '15106760418' }}
          PUBLIC_NOINDEX: ${{ (inputs.target || 'staging') == 'staging' && '1' || '' }}
      - name: Audit the built site (links, SEO basics, hreflang, sitemap)
        run: npm run test:dist
        env:
          ALLOW_NOINDEX: ${{ (inputs.target || 'staging') == 'staging' && '1' || '' }}
      - name: Integrations missing in production are reported, not blocking
        if: (inputs.target || 'staging') == 'production'
        run: |
          for v in PUBLIC_SHOP_URL PUBLIC_N8N_FORM_WEBHOOK PUBLIC_GCAL_EMBED; do
            eval "val=\${$v}"; [ -z "$val" ] && echo "::warning::$v is not set: its fallback is live (store: /store/ and contact; forms: mailto, library leads not recorded; booking: WhatsApp)"
          done
          exit 0
        env:
          PUBLIC_SHOP_URL: ${{ vars.PUBLIC_SHOP_URL }}
          PUBLIC_N8N_FORM_WEBHOOK: ${{ vars.PUBLIC_N8N_FORM_WEBHOOK }}
          PUBLIC_GCAL_EMBED: ${{ vars.PUBLIC_GCAL_EMBED }}
      - name: Every product the site links to exists in the Shopify store
        if: (inputs.target || 'staging') == 'production' && vars.PUBLIC_SHOP_URL != ''
        run: npm run check:shop
        env:
          PUBLIC_SHOP_URL: ${{ vars.PUBLIC_SHOP_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-${{ inputs.target || 'staging' }}
          path: dist
          include-hidden-files: true   # .htaccess
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}   # production: required reviewers + environment secrets (FTP_*)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: site-${{ inputs.target || 'staging' }}
          path: dist
      - name: Upload to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dry-run: ${{ inputs.dry_run == true }}
          # Never touch what the content panel manages on the server (libraries zip + manifest, uploaded media)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            downloads/libraries/**
            uploads/**
            portal/**
            staging/**
      - name: Smoke test the live URL
        if: ${{ !inputs.dry_run }}
        run: node scripts/smoke.mjs
        env:
          SITE_URL: ${{ env.SITE_URL }}
          EXPECT_NOINDEX: ${{ (inputs.target || 'staging') == 'staging' && '1' || '' }}
